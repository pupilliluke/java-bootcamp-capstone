# Tests run under their own profile so the local profile's PostgreSQL datasource
# never applies. Without this, spring.profiles.default=local would pull the
# container config into every @SpringBootTest and the suite would need Docker.
spring.profiles.active=test

# Test-only secret so every @SpringBootTest context can resolve the placeholder
# without JWT_SECRET being set. Runtime still requires the real value from the
# environment: application.yml deliberately has no default.
#
# This is application.properties, not application.yml, on purpose. A test
# application.yml would shadow the main one entirely and take the Kafka and
# server config with it; a differently named file just contributes these keys.
crm.security.jwt.secret=test-secret-that-is-at-least-32-bytes-long

# A stand-in Google client id so the context loads without depending on the real
# value. The tests that exercise Google sign-in replace GoogleTokenVerifier with
# a mock, so nothing here ever reaches Google or checks this audience.
crm.security.google.client-id=test-google-client-id.apps.googleusercontent.com

# A handful of demo customers rather than the 1000 a local run gets. Not 0: at 0
# the seeder's bulk path never executes under test, and the sequence draw and
# generated-email uniqueness in it are exactly the parts that would fail against
# a real constraint. 25 exercises all of it, leaves a CLOSED customer or two for
# the status-filter tests to have to exclude, and costs a fraction of a second
# instead of loading a thousand rows into every test JVM.
crm.demo.customer-count=25

# In-memory H2 in PostgreSQL mode so the whole suite runs with no Docker and no
# running database. Flyway applies the real migration against it, so the schema
# under test is the schema that ships.
spring.datasource.url=jdbc:h2:mem:crm;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
