spring:
  application:
    name: crm

  # Local container credentials, overridden by the environment in any deployed
  # setting. Unlike the JWT secret these are not left blank: they guard a
  # throwaway localhost container and are already visible in docker-compose.yml,
  # whereas a leaked signing key would let anyone mint a valid ADMIN token.
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/crm}
    username: ${DB_USER:crm}
    password: ${DB_PASSWORD:crm}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

    consumer:
      group-id: crm-interaction-service-v1
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.capstone.crm.messaging.event
        spring.json.value.default.type: com.capstone.crm.messaging.event.InteractionEvent

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        enable.idempotence: true
        acks: all

    listener:
      ack-mode: record

server:
  port: 8080

crm:
  security:
    jwt:
      # No default on purpose: a committed fallback is a weak secret that ships.
      # Must be at least 32 characters — HS256 needs a 256-bit key and startup
      # fails loudly on anything shorter.
      secret: ${JWT_SECRET}
      issuer: capstone-crm
      expiration-minutes: 60
