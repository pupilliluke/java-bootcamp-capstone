spring:
  application:
    name: crm

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

    consumer:
      group-id: crm-interaction-service-v1
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.capstone.crm.messaging.event
        spring.json.value.default.type: com.capstone.crm.messaging.event.InteractionEvent

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        enable.idempotence: true
        acks: all

    listener:
      ack-mode: record

server:
  port: 8080

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{correlationId}] %logger{36} - %msg%n"
crm:
  security:
    jwt:
      # No default on purpose: a committed fallback is a weak secret that ships.
      # Must be at least 32 characters — HS256 needs a 256-bit key and startup
      # fails loudly on anything shorter.
      secret: ${JWT_SECRET}
      issuer: capstone-crm
      expiration-minutes: 60
