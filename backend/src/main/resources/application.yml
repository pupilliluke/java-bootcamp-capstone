spring:
  application:
    name: crm

  # Which database is used is chosen by profile, not by editing this file.
  #   local (default) -> the docker-compose container
  #   azure           -> the hosted server, values supplied by .env
  profiles:
    default: local

  # Secrets come from a gitignored .env at the repository root. The [.properties]
  # hint tells Spring to parse it as a properties file. Both candidate paths are
  # listed because the import resolves against the JVM working directory, and a
  # path that misses is skipped silently thanks to optional: — launching from
  # the repo root uses the first, launching from backend/ uses the second.
  #
  # In a deployed environment there is no .env, both imports skip, and the same
  # variable names arrive as real environment variables instead. The image does
  # not change between a laptop and Azure.
  config:
    import: optional:file:./.env[.properties],optional:file:../.env[.properties]

  datasource:
    hikari:
      # Hikari's default is 30 seconds, and measurement is what makes that the
      # wrong number here: with the database stopped, /actuator/health/readiness
      # took 31.0s to answer 503. It answers correctly, but a readiness probe
      # that blocks a request thread for half a minute is one that runs out of
      # threads during exactly the outage it exists to report.
      #
      # 10s keeps roughly that much slack for a database still accepting its
      # first connections at startup, while bounding what one probe can hold.
      # The trade is real in the other direction too: a request that cannot get
      # a connection now fails in 10s instead of 30, which for a web request is
      # an improvement -- 30 seconds is longer than most callers wait anyway.
      connection-timeout: 10000

  jpa:
    hibernate:
      # validate, never update: the schema is Flyway's to own. An entity that
      # drifts from the migration fails at startup instead of silently altering
      # a table in Azure.
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

    consumer:
      # Both the topic and this group are placeholders for the same reason: the
      # course broker is one shared Kafka with no per-user isolation. Two teams
      # running the same group id against it join the same consumer group, and
      # the coordinator then splits partitions between applications that have
      # nothing to do with each other -- so each side silently sees a fraction of
      # its own events and rebalances whenever the other restarts.
      #
      # Prefixing the topic alone would not fix that. The group id is a separate
      # namespace on the broker and needs its own value.
      group-id: ${crm.messaging.consumer-group}
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.capstone.crm.messaging.event
        spring.json.value.default.type: com.capstone.crm.messaging.event.InteractionEvent

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        enable.idempotence: true
        acks: all

    listener:
      ack-mode: record

server:
  port: 8080

management:
  endpoint:
    health:
      # when-authorized, not always: the health endpoint is public so the
      # container orchestrator can probe it, and "always" would hand an
      # anonymous caller the database vendor, connection state and disk figures.
      # Signed-in users get the detail, which is what the setup check reads.
      show-details: when-authorized
      probes:
        enabled: true

      # The two probes answer different questions, and conflating them is the
      # classic way to turn a database outage into an outage of everything.
      #
      # readiness — "should this instance be sent traffic right now?"
      # Kubernetes uses it to decide Service membership. The default group holds
      # only readinessState, a flag meaning Spring finished starting, which never
      # consults the datasource: an instance whose database had gone would keep
      # answering UP and keep being sent requests it cannot serve. Worse during a
      # rolling deploy, where new instances report ready before they can work and
      # the old ones are retired underneath them. Adding db is what makes the
      # answer honest.
      #
      # liveness — "is this instance broken beyond recovery, restart it?"
      # db is deliberately NOT here. Failing liveness kills the container, and
      # restarting an application cannot fix a database that is down: every
      # instance would fail at once and crash-loop until the database returned,
      # turning a recoverable outage into a self-inflicted one. Liveness stays a
      # question about this process only.
      group:
        readiness:
          include: readinessState,db
        liveness:
          include: livenessState

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{correlationId}] %logger{36} - %msg%n"
crm:
  demo:
    # How many customers DemoCustomerSeeder leaves the table holding, CUS-1001
    # and CUS-1002 included. Enough rows that the list page pages, the status
    # filter has something to filter, and an EXPLAIN over customer(status)
    # measures something rather than two rows.
    #
    # A target rather than an amount to add, so restarting does not keep piling
    # rows on. 0 turns it off, which is what to set before pointing a run at a
    # database anyone else uses.
    customer-count: ${CRM_DEMO_CUSTOMER_COUNT:1000}

  messaging:
    # Defaults are the local names, so docker-compose and the test suite are
    # unaffected and nobody has to set anything to run the project.
    #
    # The trade is deliberate, and worth being honest about. A default that
    # works locally is also a default that collides on the shared cluster if
    # nobody overrides it, and that failure is silent -- you read another team's
    # interactions instead of getting an error.
    #
    # What reduces the odds is placement, not the default: k8s/configmap.yaml
    # carries both keys next to LOCAL_DB_HOST and KAFKA_BOOTSTRAP_SERVERS, which
    # already have to be repointed before anything can reach the cluster. The
    # change is in front of whoever does that work rather than buried here.
    #
    # On the course cluster, prefix both with your own namespace:
    #   CRM_INTERACTION_TOPIC=studentNN.crm.interaction.v1
    #   CRM_CONSUMER_GROUP=studentNN.crm-interaction-service-v1
    #
    # The dead letter topic follows automatically. KafkaConfig derives it as
    # record.topic() + ".DLT", so a prefixed topic gets a prefixed DLT with no
    # second value to keep in step.
    interaction-topic: ${CRM_INTERACTION_TOPIC:crm.interaction.v1}
    consumer-group: ${CRM_CONSUMER_GROUP:crm-interaction-service-v1}

  security:
    jwt:
      # No default on purpose: a committed fallback is a weak secret that ships,
      # so a missed import crashes at startup rather than quietly running on one.
      # The value comes from .env locally and from an environment variable of the
      # same name once deployed. Must be at least 32 characters: HS256 needs a
      # 256-bit key.
      secret: ${JWT_SECRET}
      issuer: capstone-crm
      expiration-minutes: 60
    google:
      # The OAuth 2.0 Web-application client id. Unlike the JWT secret this is
      # not a secret — it ships in the frontend bundle — so a public default is
      # committed here to let Google Sign-In work out of the box, and GOOGLE_CLIENT_ID
      # overrides it per environment. It is the audience every ID token is checked
      # against, so a wrong value rejects every Google login rather than opening one.
      client-id: ${GOOGLE_CLIENT_ID:398192114075-fb8j3jdt7m2qrqpe6957g5o57ajppfhn.apps.googleusercontent.com}
