apiVersion: v1
kind: Service
metadata:
  name: crm-api
  labels:
    app: crm-api
spec:
  type: ClusterIP
  selector:
    app: crm-api
  ports:
    - name: http
      port: 80
      # The port's NAME, not its number. If the container port ever moves the
      # name follows it and this stays correct; a hardcoded 8080 would not.
      targetPort: http
