apiVersion: v1
kind: Service
metadata:
  name: crm-api
  # No namespace: on purpose. `kubectl -n <ns> apply` decides where this lands,
  # so the same file serves the CI cluster's `crm` and a course-cluster namespace
  # like `student02` with no edit. A hardcoded namespace here would also make
  # `kubectl -n student02 apply -f` fail outright rather than quietly do the
  # wrong thing -- kubectl refuses when the flag and the file disagree.
  labels:
    app: crm-api
spec:
  type: ClusterIP
  selector:
    app: crm-api
  ports:
    - name: http
      port: 80
      # The port's NAME, not its number. If the container port ever moves the
      # name follows it and this stays correct; a hardcoded 8080 would not.
      targetPort: http
