# DOCUMENTATION ONLY. Do not kubectl apply this file.
#
# It lives in k8s/examples/ rather than beside the real manifests because
# `kubectl apply -f k8s/` reads the files in that directory and would apply it.
# Verified: a dry run against k8s/ listed `secret/crm-api-secrets configured`.
# kubectl does not descend into subdirectories without -R, so from here it is
# out of reach of that command while still being schema-validated in CI.
#
# Applying it would overwrite a working Secret with the placeholders below and
# take the deployment down. It would not leak a usable signing key -- the
# placeholder is 152 bits and jjwt rejects anything under 256 for HS256 -- but
# clobbering a real Secret is the worse outcome of the two.
#
# Applying it would create a Secret whose values are the literal placeholders
# below, and the pod would start with a JWT signing key that is published in a
# public repository. This file exists to record which keys the Secret must
# carry, in the same spirit as .env.example.
#
# Create the real one from the command line, so no value is ever written to a
# file that git can see:
#
#   kubectl -n crm create secret generic crm-api-secrets #     --from-literal=LOCAL_DB_PASSWORD="$LOCAL_DB_PASSWORD" #     --from-literal=JWT_SECRET="$JWT_SECRET"
#
# Or straight from the gitignored .env, which already holds both:
#
#   kubectl -n crm create secret generic crm-api-secrets --from-env-file=.env
#
# Note that --from-env-file loads every key in the file, including the AZURE_*
# values. Prefer the explicit form unless you mean to ship those too.
apiVersion: v1
kind: Secret
metadata:
  name: crm-api-secrets
  namespace: crm
  labels:
    app: crm-api
type: Opaque
stringData:
  LOCAL_DB_PASSWORD: "REPLACE-OUT-OF-BAND"
  # application.yml declares crm.security.jwt.secret with no default, so the pod
  # will not start at all without this key. That is intentional: a missing
  # signing key should stop a deploy rather than fall back to a known one.
  JWT_SECRET: "REPLACE-OUT-OF-BAND"
