# A throwaway PostgreSQL for the smoke test, and nothing else.
#
# Deliberately separate from k8s/ so it can never be applied by a `kubectl apply
# -f k8s/` that was meant for the real manifests. No volume, no persistence, no
# resource requests: it exists for the length of one CI job and is thrown away
# with the cluster.
#
# The password is a literal because there is nothing to protect -- this database
# holds two seeded demo customers and lives for ninety seconds. Every real
# deployment takes its password from a Secret created out of band; see
# k8s/examples/secret.example.yaml.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: crm
  labels:
    app: postgres
    role: test-fixture
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
        role: test-fixture
    spec:
      containers:
        - name: postgres
          image: postgres:17
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_DB
              value: crm
            - name: POSTGRES_USER
              value: crm
            - name: POSTGRES_PASSWORD
              value: smoke-test-only
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "crm", "-d", "crm"]
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: crm
  labels:
    app: postgres
    role: test-fixture
spec:
  type: ClusterIP
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
