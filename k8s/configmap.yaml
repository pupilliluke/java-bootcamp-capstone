apiVersion: v1
kind: ConfigMap
metadata:
  name: crm-api-config
  # No namespace: on purpose. `kubectl -n <ns> apply` decides where this lands,
  # so the same file serves the CI cluster's `crm` and a course-cluster namespace
  # like `studentNN` with no edit. A hardcoded namespace here would also make
  # `kubectl -n studentNN apply -f` fail outright rather than quietly do the
  # wrong thing -- kubectl refuses when the flag and the file disagree.
  labels:
    app: crm-api
data:
  # Everything here is readable by anyone with get on ConfigMaps. Nothing that
  # would matter if it leaked belongs in this file -- the password and the JWT
  # signing key live in the Secret instead.
  #
  # The local profile, not a k8s one: application-local.yml already takes every
  # value from the environment, so the same profile serves docker-compose and a
  # cluster. A k8s-specific profile would be a third copy of the same three
  # datasource lines with nothing different in it.
  SPRING_PROFILES_ACTIVE: "local"
  # The human name for this environment, shown by the Settings connection
  # panel. The profile above names the configuration shape, which every
  # deployment reuses -- this names the place.
  CRM_ENVIRONMENT: "k3d-local"
  SERVER_PORT: "8080"

  # host.k3d.internal is injected into CoreDNS by k3d and resolves to the host,
  # where docker-compose publishes PostgreSQL on 5432.
  LOCAL_DB_HOST: "host.k3d.internal"
  LOCAL_DB_PORT: "5432"
  LOCAL_DB_NAME: "crm"
  LOCAL_DB_USER: "crm"

  # Deliberately pointed at the host, and deliberately expected to fail.
  #
  # The compose broker advertises PLAINTEXT://localhost:9092. A pod resolves the
  # bootstrap address fine, then follows the advertised listener to "localhost",
  # which inside the pod is the pod. Interactions therefore cannot publish from
  # the cluster until the broker advertises an address a pod can reach, or Kafka
  # runs in-cluster. Everything else -- login, customers, health -- works.
  KAFKA_BOOTSTRAP_SERVERS: "host.k3d.internal:9092"

  # The local names, and both must change on the course cluster.
  #
  # That broker is one shared Kafka with no per-user topic isolation, and every
  # team is building this same CRM. Left as they are, four deployments publish
  # into crm.interaction.v1 and join crm-interaction-service-v1 together: each
  # one then reads other teams' interactions and sees only a share of its own.
  # Nothing errors, so nothing tells you.
  #
  # Prefix both with the namespace, matching the schema and namespace names:
  #   CRM_INTERACTION_TOPIC: "studentNN.crm.interaction.v1"
  #   CRM_CONSUMER_GROUP:    "studentNN.crm-interaction-service-v1"
  #
  # The dead letter topic needs no entry. KafkaConfig derives it from whatever
  # the record's topic was, so a prefixed topic already gets a prefixed .DLT.
  CRM_INTERACTION_TOPIC: "crm.interaction.v1"
  CRM_CONSUMER_GROUP: "crm-interaction-service-v1"
