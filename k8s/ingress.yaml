apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: crm-api
  # No namespace: on purpose. `kubectl -n <ns> apply` decides where this lands,
  # so the same file serves the CI cluster's `crm` and a course-cluster namespace
  # like `student02` with no edit. A hardcoded namespace here would also make
  # `kubectl -n student02 apply -f` fail outright rather than quietly do the
  # wrong thing -- kubectl refuses when the flag and the file disagree.
  labels:
    app: crm-api
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
    - host: crm-api.localtest.me
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: crm-api
                port:
                  number: 80
  # localtest.me resolves to 127.0.0.1 from anywhere, so this needs no hosts
  # file edit on any of the four machines. TLS is out of scope locally; the
  # smoke check uses plain HTTP against the k3d load balancer port.
