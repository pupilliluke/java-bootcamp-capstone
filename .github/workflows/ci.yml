# Build and test every change, before it reaches develop or main.
#
# Shape follows lab 43's crm-ci.yml, adapted to this repository: two modules
# instead of one, and the wrapper rather than a system Maven so CI builds with
# the same version the enforcer pins locally.
#
# One GitHub secret is used: NVD_API_KEY, a read-only rate-limit token for the
# National Vulnerability Database that grants no access to anything of ours. The
# test suite supplies its own JWT secret from
# src/test/resources/application.properties, and the database below is a
# throwaway container that exists for the length of one job. Nothing else here
# can leak, because there is nothing else here to leak.
name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

# A second push to the same branch cancels the first. Without this, a busy
# afternoon queues runs that are already out of date by the time they start.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Read-only by default. The package job needs nothing more, and a workflow that
# cannot write cannot be turned into one that pushes.
permissions:
  contents: read

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # AppUserRepositoryIT is gated on a reachable PostgreSQL and skips silently
    # without one. Providing the service here is what makes it run, so every
    # pull request validates the migrations against a real server rather than
    # against H2's emulation of one.
    services:
      postgres:
        # Matches docker-compose.yml. Azure runs 18; the difference has not
        # mattered yet, and CI should mirror what people run locally.
        image: postgres:17
        env:
          POSTGRES_DB: crm
          POSTGRES_USER: crm
          POSTGRES_PASSWORD: ci-throwaway-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U crm -d crm"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    # The same three keys .env supplies locally. They have no defaults on
    # purpose, so without them the integration test cannot resolve its
    # datasource and the context fails to start.
    env:
      LOCAL_DB_NAME: crm
      LOCAL_DB_USER: crm
      LOCAL_DB_PASSWORD: ci-throwaway-password

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml

      # No -DskipTests. verify runs unit tests, the embedded-Kafka integration
      # test, and the repository test against the service container above.
      - name: Verify
        run: ./mvnw -B -ntp clean verify

      # TODO: the Dependency-Check gate belongs here, as its own issue.
      # See notes/Week 5/Module 40/lab40-dependency-check-plan.md.

      # if: always() so a failing build still uploads the reports that explain
      # why. Without it the one run you actually need to read has no evidence.
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: |
            backend/target/surefire-reports/**
            backend/target/failsafe-reports/**

      # The NVD feed is 383k records and about 190MB on disk. Downloading all of
      # it is what turned the step below into an hour-long coin flip, so it gets
      # a cache of its own rather than riding along in the Maven one.
      #
      # It would ride along by default: the plugin keeps its database under
      # ~/.m2/repository/org/owasp/dependency-check-data, which is inside the
      # path setup-java caches above. That does not help, for two reasons. Cache
      # entries are immutable, and setup-java keys the Maven cache on the hash of
      # backend/pom.xml - so the database is written at most once, on the first
      # run after a POM change, and is never refreshed however far behind it
      # falls. And a run cancelled mid-download saves nothing at all, which is
      # exactly the run that most needed to save something. Giving it its own
      # directory also keeps 190MB of vulnerability data out of an entry whose
      # job is to hold jars.
      #
      # The key is windowed for the same immutability reason: a fixed key is
      # written once and then goes stale forever. The window is 72 hours, to
      # match nvdValidForHours below. Inside one window a run that finds the key
      # restores the same database and makes no NVD call at all; at the rollover
      # a single run pays for an incremental update and writes the next entry.
      #
      # Which runs find it depends on scope, which is worth knowing before
      # reading a slow pull request as a bug. A run may read caches from its own
      # ref, its base branch and the default branch, but may only write to its
      # own. So the entries that everyone benefits from are the ones written by
      # the push trigger on main and develop; a pull request reads those and
      # keeps its own writes to itself.
      #
      # The combined action rather than restore/save as two steps, deliberately.
      # actions/cache declares post-if: success(), so a run whose gate goes red
      # saves nothing - which looks like a bug worth fixing and is not. Inside a
      # window the restore is an exact key hit, and the action never saves on an
      # exact hit regardless; the only run the difference reaches is the first
      # partial hit of a new window, where the cost is one delta update of a few
      # minutes. Splitting the steps to save on failure buys that back and gives
      # up something better: post-if is what stops a run that times out
      # mid-download from claiming the window's immutable key with a half-built
      # database that a later, healthy run would then be unable to replace. Matching the two is what keeps this cheap - a daily key against a
      # 72-hour validity would re-upload 190MB every day to store a database the
      # plugin had not touched, evicting the Maven cache to do it. Bump the v1 to
      # force a full rebuild if a plugin upgrade ever changes the on-disk schema.
      - name: Stamp the NVD cache window
        id: nvd-window
        # Whole 72-hour periods since the epoch. 259200 = 72 * 60 * 60.
        run: echo "window=$(( $(date -u +%s) / 259200 ))" >> "$GITHUB_OUTPUT"

      - name: Cache the NVD database
        uses: actions/cache@v4
        with:
          path: ~/.dependency-check-data
          key: nvd-v1-${{ steps.nvd-window.outputs.window }}
          restore-keys: nvd-v1-

      # Answers a different question from the trivy scan in the image job. Trivy
      # looks at the built container; this looks at the dependency tree Maven
      # resolves, so it sees things that never reach an image layer and it runs
      # without waiting for a build.
      #
      # Pull requests included, deliberately. The finding set moves when the world
      # moves rather than when the diff does, which is an argument for running it
      # often rather than an argument for running it late: a CVE published on
      # Tuesday should not first appear on a merge to main.
      #
      # continue-on-error is deliberately NOT set. A High or worse finding stops
      # the build. Without that this is a report, and the rubric's Exemplary
      # descriptor asks for a gate.
      #
      # timeout-minutes is sized for the cold download, not for the steady
      # state, and that is a decision forced by having no API key. Populating an
      # empty database unauthenticated takes about an hour and a half - run
      # 32996264931 reached 91% of the feed in 78 minutes - so anything under
      # that guarantees the first run dies before it can write a cache, and a
      # cache that is never written is a gate that never runs. 110 gives one
      # cold run room to finish and still bounds a genuinely stuck one.
      #
      # This is a one-time cost per cache scope, not a per-run cost. Once an
      # entry exists, a run inside the window makes no NVD call at all and this
      # step is single-digit minutes; a run that crosses a window boundary asks
      # only for the delta, which is a few thousand records even unauthenticated.
      # Drop this back to about 20 the day an NVD_API_KEY exists.
      #
      # Note for whoever reads run 32996264931: it was not killed by a timeout.
      # It was cancelled by cancel-in-progress above when the next push landed,
      # which is also why it saved nothing. The first cold run needs a quiet
      # branch to finish on.
      - name: Dependency-Check
        timeout-minutes: 110
        env:
          # Unset today, and the cache above is what makes that survivable
          # rather than merely possible. Unauthenticated NVD access is throttled
          # to roughly 5 requests per 30 seconds against about 50 with a key -
          # the difference between a few minutes and an hour and a half to build
          # the database from empty. The earlier claim here that unauthenticated
          # access simply "works" did not survive contact with a real run.
          #
          # The shape of the fix follows from that: pay the long download once
          # per cache scope, then keep the result long enough that no ordinary
          # run has to talk to NVD at all. If a key is ever obtained, set this
          # secret and lower timeout-minutes above - nothing else needs to move.
          # Requests: https://nvd.nist.gov/developers/request-an-api-key
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        # The threshold and the suppressions live in the POM and in
        # backend/dependency-check-suppressions.xml, so the gate itself judges a
        # laptop and this runner identically. Only the two flags below are
        # CI-specific: where the database sits, because that is what the cache
        # above keys on, and how long the plugin trusts it before going back to
        # NVD. A laptop goes on using the defaults - the plugin's own directory
        # under ~/.m2, refreshed every 4 hours.
        #
        # nvdValidForHours=72 against a default of 4. It is a real trade: a CVE
        # published on Monday may not be visible here until Thursday. What it
        # buys is the step itself - inside the window there is no NVD call to be
        # throttled, stalled or cancelled, which is the failure this whole block
        # exists to prevent, and a gate that finishes three days behind catches
        # strictly more than one that never finishes at all. Note this bounds how
        # stale the data is, not how late the gate runs: the argument above about
        # not first meeting a CVE on a merge to main is about when this step
        # fires, and that is still every push.
        run: >-
          ./mvnw -B -ntp -Psecurity-scan dependency-check:check
          -DdataDirectory="$HOME/.dependency-check-data"
          -DnvdValidForHours=72

      - name: Upload the vulnerability report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: reports/**

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # ci, not install: it installs exactly the lock file and fails if
      # package.json and the lock have drifted apart.
      - name: Install
        run: npm ci

      - name: Types
        run: npx tsc -b

      # test:ci, not test. Plain `npm test` is vitest in watch mode and would
      # hang the runner until it timed out.
      - name: Tests
        run: npm run test:ci

      # The build is a gate of its own: tsc passes on things vite still refuses
      # to bundle.
      - name: Build
        run: npm run build

  # The container image, tested in four layers before it is allowed anywhere.
  # Each answers a question the others cannot, and they are ordered cheapest
  # first so an obvious mistake fails in seconds rather than after a build:
  #
  #   hadolint                  is the Dockerfile written correctly?
  #   container-structure-test  is the built image the right shape?
  #   trivy                     does it ship known vulnerabilities or secrets?
  #   ContainerImageIT          does the application in it actually work?
  #
  # On pull requests as well as pushes. A gate that only runs after merge is a
  # report, not a gate.
  image:
    name: image
    needs: [backend, frontend]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Before the build, not after: a Dockerfile problem should not cost the
      # several minutes it takes to compile the application first.
      - name: Lint the Dockerfile
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: backend/Dockerfile
          failure-threshold: warning

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml

      # buildx, for one reason: a layer cache that survives between runs. A
      # plain `docker build` on a fresh runner has nothing cached, so it
      # re-resolves the whole Maven dependency tree and repackages on every
      # pull request -- around five minutes each time, for a jar that usually
      # differs by a few classes.
      - uses: docker/setup-buildx-action@v4.3.0

      # GIT_SHA is a build argument because .dockerignore excludes .git/, so
      # nothing inside the build can read the commit for itself.
      #
      # load: true puts the built image into the runner's Docker daemon. Without
      # it the result stays inside buildx and the three steps below -- which all
      # address it as crm-api:test through the daemon -- find no such image.
      #
      # mode=max, not the default min: min caches only the final stage, and in a
      # multi-stage build that is the thin runtime layer. The expensive layer is
      # dependency:go-offline in the build stage, which min throws away, which
      # would leave the cache technically working and practically useless.
      #
      # Worth knowing: the GitHub Actions cache holds 10 GB per repository and
      # evicts anything unread for 7 days. If the image job starts feeling slow
      # again after a quiet fortnight, this is why, and it is self-correcting.
      - name: Build the image
        uses: docker/build-push-action@v7.3.0
        with:
          context: backend
          load: true
          tags: crm-api:test
          build-args: |
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Everything decidable from the image without running it: the user it runs
      # as, the labels, that the JDK and the sources stayed in the build stage,
      # and that no credential rode along in a layer.
      - name: Structure tests
        run: |
          curl -fsSL -o container-structure-test \
            https://storage.googleapis.com/container-structure-test/latest/container-structure-test-linux-amd64
          chmod +x container-structure-test
          ./container-structure-test test \
            --image crm-api:test --config backend/container-structure-test.yaml

      # REPORT-ONLY FOR NOW (exit-code 0). Read this before changing it.
      #
      # The image currently carries 8 critical and 41 high findings, nearly all
      # of them from the application's own dependencies rather than the base
      # image: tomcat-embed-core 10.1.31 alone accounts for 5 critical and 14
      # high, and spring-security-web 6.3.4 for another critical. They have
      # fixes available, so ignore-unfixed does not filter them out.
      #
      # Set exit-code to 1 and this job fails on every pull request from the
      # moment it merges, for everyone, over problems no individual pull request
      # introduced. A gate that is red on the day it lands is a gate the team
      # learns to ignore, so it starts as a report and becomes a gate once the
      # findings are dealt with.
      #
      # The fix is one line: the spring-boot-starter-parent version in
      # backend/pom.xml is 3.3.5, from October 2024. Bumping it pulls patched
      # Tomcat and Spring Security in transitively. Do that first, confirm this
      # step reports clean, then change exit-code to "1" and delete this comment.
      #
      # Locally, `docker scout quickview crm-api:test` answers the same question
      # in seconds and needs no database download, which on a home connection is
      # the difference between a usable check and a forty-minute one. Trivy runs
      # here because the action caches its database between runs and because it
      # also sweeps for committed secrets.
      - name: Vulnerability and secret scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: crm-api:test
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"

      # Last, because it is the slowest: starts the real image against a real
      # PostgreSQL and talks to it over HTTP. Testcontainers brings its own
      # database, so no service block is needed here.
      #
      # The failsafe goals directly rather than `verify`, and it.test naming the
      # one class. `verify` would re-run every unit test and both other
      # integration tests, all of which the backend job has already run on this
      # same commit -- roughly two minutes added to every pull request for a
      # second opinion nobody asked for.
      - name: Container tests
        working-directory: backend
        run: >-
          ./mvnw -B -ntp test-compile
          failsafe:integration-test failsafe:verify
          -Pimage-tests -Dit.test=ContainerImageIT

      - name: Upload container test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: container-image-test-reports
          path: backend/target/failsafe-reports/**

  # Schema-validates k8s/ against the Kubernetes API. No cluster involved, which
  # is the point -- YAML parsing proves a file is well formed, not that the
  # fields exist. A misspelled probe field or an apiVersion removed two releases
  # ago parses perfectly and fails at `kubectl apply`, which during a demo means
  # in front of people.
  #
  # Verified failable rather than assumed: renaming failureThreshold to
  # failureThresold gave "additional properties 'failureThresold' not allowed"
  # and exit 1; downgrading the Ingress to networking.k8s.io/v1beta1 gave "could
  # not find schema for Ingress" and exit 1.
  manifests:
    name: manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pinned to the version the k3d cluster actually runs, so a field valid on
      # a newer API but absent here is caught rather than waved through.
      # -strict rejects unknown fields; without it a typo is silently ignored.
      # The count guard is the part that makes this a check rather than a
      # formality. kubeconform exits 0 on an empty directory -- "0 resources
      # found ... Errors: 0" -- so a renamed folder or a wrong path would go
      # green having validated nothing. Verified: an empty directory passes on
      # its own, and fails with the guard.
      #
      # -verbose names each file in the log, so the run is its own evidence
      # rather than a single summary line nobody can check.
      - name: Validate the Kubernetes manifests
        run: |
          # Required, and not decoration. GitHub's default shell is `bash -e {0}`
          # WITHOUT pipefail -- only an explicit `shell: bash` adds it. kubeconform
          # is piped into tee below so the report can be uploaded as an artifact,
          # and without this line the step's exit status is tee's, which is always
          # 0. Verified against kubeconform v0.8.0 and a real broken manifest:
          # renaming failureThreshold to failureThresold exits 1 unpiped, exits 0
          # through the pipe, and exits 1 again with this line present. The
          # file-count guard below does not compensate -- kubeconform prints the
          # same "in 7 files" summary whether resources are valid or invalid.
          set -o pipefail

          expected=$(find k8s -name '*.yaml' -type f | wc -l | tr -d ' ')
          if [ "$expected" -eq 0 ]; then
            echo "No manifests found in k8s/ - nothing was validated."
            exit 1
          fi
          echo "Validating $expected manifest(s)"

          curl -fsSL https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz             | tar -xz kubeconform

          ./kubeconform -strict -summary -verbose             -kubernetes-version 1.35.5 k8s/ | tee kubeconform.txt

          grep -q "in $expected file" kubeconform.txt || {
            echo "kubeconform validated a different number of files than the $expected present."
            exit 1
          }

      - name: Upload the validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kubeconform-report
          path: kubeconform.txt

  # Deploys the manifests to a real cluster, proves the application serves, breaks
  # the deployment on purpose and proves it recovers.
  #
  # The manifests job answers "are these legal Kubernetes resources". This one
  # answers the question that actually matters: does the thing they describe
  # work. A schema check would pass a Deployment that points at an image which
  # does not exist, names a Secret key nothing provides, or probes a path that
  # returns 404.
  #
  # Runs after image, so a cluster is only spun up for an image that already
  # passed hadolint, the structure tests and its own integration suite.
  cluster:
    name: cluster
    needs: [backend, frontend, image]
    runs-on: ubuntu-latest
    # Bounded deliberately: a cluster that never converges would otherwise hold a
    # runner for the six-hour default. A full local run is about four minutes.
    #
    # 30 rather than 20, because smoke.sh's own waits can legitimately add up past
    # 20 on a bad run -- 420s for the postgres pull, 300s for the rollout, 60s for
    # the deliberate break, 300s for the rollback -- on top of a cold docker build.
    # The job timeout should be the backstop that catches a hang, not the thing
    # that fires first on a merely slow run.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Rebuilt rather than carried from the image job, because jobs do not share
      # a Docker daemon. Through buildx with the same type=gha cache the image job
      # writes, so the rebuild reuses those layers instead of starting cold.
      #
      # It used to be a plain `docker build` under a comment claiming the layer
      # cache made it cheap. That was false: without buildx there is no gha cache
      # and every run was a full multi-stage Maven build.
      #
      # GIT_SHA matters -- the structure tests reject an image whose revision
      # label says "unknown".
      - uses: docker/setup-buildx-action@v4.3.0

      - name: Build the image
        uses: docker/build-push-action@v7.3.0
        with:
          context: backend
          load: true
          tags: crm-api:dev
          build-args: |
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # k3d rather than kind, because it is what the team runs locally. The
      # rehearsal in docs/rollback-runbook.md and this job are then evidence
      # about the same thing rather than two similar ones.
      # k3d is installed directly rather than through AbsaOSS/k3d-action. That
      # action hardcodes k3d v5.4.6 and its installer now 404s -- observed on
      # run 32898474495, which failed before a cluster ever existed. Pinning the
      # version here also means CI runs the same k3d as a laptop, so the
      # rehearsal recorded in docs/rollback-runbook.md and this job are evidence
      # about the same thing rather than two similar ones.
      - name: Install k3d
        run: |
          # pipefail matters here for the same reason it does in the manifests
          # job. Piping curl into bash under the default `bash -e {0}` hides
          # curl's exit code, and a failed download feeds bash an empty script
          # which exits 0 -- a silently skipped install, not a failed one.
          set -o pipefail
          curl -sfL https://raw.githubusercontent.com/k3d-io/k3d/main/install.sh | TAG=v5.9.0 bash

          # The install is only real if the binary runs.
          k3d version

      # The same flags as the create command in docs/rollback-runbook.md.
      #
      # --image is not optional: k3d's built-in default k3s moves with every k3d
      # release, and a cluster on a different one is not the cluster the
      # manifests job validates against.
      - name: Create the cluster
        run: |
          k3d cluster create ci --agents 0 \
            -p "8088:80@loadbalancer" \
            --api-port 127.0.0.1:6445 \
            --image rancher/k3s:v1.35.5-k3s1

      # Separate from the create, and not optional. `k3d cluster create` returns
      # when the server container is running, which is not the same as
      # kube-apiserver answering requests -- it prints "Cluster 'ci' created
      # successfully!" and the very next kubectl can still get
      # "Error from server (ServiceUnavailable): the server is currently unable
      # to handle the request".
      #
      # That gap is why this job used to fail in a different place on each run:
      # whichever kubectl call happened to land inside the window died, so the
      # symptom moved between `kubectl version`, the image-import check, and
      # smoke.sh's first apply, and looked like three unrelated problems.
      #
      # /readyz rather than /healthz: healthz goes green while the apiserver is
      # still finishing startup, readyz is the one that means "will serve you".
      # Polled with `kubectl get --raw` rather than `kubectl wait`, because wait
      # needs a working API to wait against and exits immediately when it has
      # none -- it cannot be its own readiness check.
      - name: Wait for the cluster to be ready
        run: |
          for _ in $(seq 1 90); do
            if kubectl get --raw='/readyz' >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done
          # Unpolled, so a cluster that never came up fails here with the real
          # server error rather than silently continuing into the next step.
          kubectl get --raw='/readyz'

          kubectl wait --for=condition=Ready node --all --timeout=180s

          # CoreDNS resolves the in-cluster PostgreSQL Service that smoke.sh
          # points the ConfigMap at. Without it the pod starts, fails to resolve
          # "postgres", and the rollout times out looking like an application
          # fault rather than a cluster that was not finished starting.
          kubectl -n kube-system rollout status deploy/coredns --timeout=180s

          kubectl version
          kubectl get nodes -o wide

      # k3d runs its own containerd; an image in the runner's Docker daemon is
      # not visible to it. Without this the pod sits in ErrImagePull.
      - name: Load the image into the cluster
        run: |
          k3d image import crm-api:dev -c ci
          # Verified rather than assumed. k3d image import can exit 0 having
          # imported nothing -- observed locally, where the pod then spent ten
          # minutes in ContainerCreating pulling from Docker Hub instead. grep
          # fails the step if the image is not actually in the cluster.
          docker exec k3d-ci-server-0 crictl images | grep crm-api

      # `bash k8s/smoke.sh` rather than `./k8s/smoke.sh`. The script is authored on
      # Windows, where git does not reliably carry the executable bit, and a
      # missing +x would fail this job with "permission denied" for a reason that
      # has nothing to do with the manifests.
      # IMAGE=crm-api:dev overrides the manifest's image, which smoke.sh
      # supports for exactly this: once the manifest pins a published digest,
      # the pinned ref is the *released* build, and a pull request must test its
      # own candidate image, not re-test the release.
      - name: Deploy, smoke, break, recover
        run: IMAGE=crm-api:dev bash k8s/smoke.sh

      # Only on failure, and worth the noise then: a red cluster job with no
      # cluster left to inspect is nearly impossible to diagnose from a runner
      # that has already been destroyed.
      # failure() || cancelled(), not failure() alone. Exceeding timeout-minutes
      # CANCELS a job rather than failing it, so `if: failure()` would skip this
      # step in exactly the case where the cluster state is most needed and the
      # runner is about to be destroyed with it.
      - name: Diagnostics
        if: ${{ failure() || cancelled() }}
        run: |
          kubectl -n crm get all -o wide || true
          kubectl -n crm describe pods || true
          kubectl -n crm logs -l app=crm-api --tail=200 --all-containers || true
          kubectl -n crm get events --sort-by=.lastTimestamp | tail -40 || true

  e2e:
    name: end-to-end journey
    needs: [ backend, frontend ]
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Services belong to this job. Services from the backend job cannot be
    # shared because every GitHub Actions job runs on a separate runner.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: crm
          POSTGRES_USER: crm
          POSTGRES_PASSWORD: ci-e2e-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U crm -d crm"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      kafka:
        image: apache/kafka:4.3.1
        ports:
          - 9092:9092
        options: >-
          --health-cmd "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"
          --health-interval 10s
          --health-timeout 10s
          --health-start-period 20s
          --health-retries 12

    env:
      LOCAL_DB_HOST: localhost
      LOCAL_DB_PORT: 5432
      LOCAL_DB_NAME: crm
      LOCAL_DB_USER: crm
      LOCAL_DB_PASSWORD: ci-e2e-password
      KAFKA_BOOTSTRAP_SERVERS: localhost:9092

      # CI-only value—not a deployed or shared secret.
      JWT_SECRET: ci-e2e-secret-that-is-at-least-32-bytes-long

      # Do not load Google Sign-In during the e2e run. The Vite dev server that
      # playwright.config.ts starts reads this, so the GSI script and widget are
      # never included and cannot flake the journey. (playwright.config.ts also
      # sets it on the dev-server command; this makes the intent visible in CI.)
      VITE_ENABLE_GSI: "false"

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # playwright.config.ts starts Spring Boot and Vite and waits for their
      # readiness URLs before launching Chromium.
      - name: Run customer journey
        run: npm run test:e2e

      - name: Upload Playwright evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-e2e-report
          path: |
            frontend/playwright-report/**
            frontend/test-results/**
          if-no-files-found: warn
          retention-days: 14

  # Lab 43's second idea: build the artifact once, and give it an identity that
  # can be traced back to the commit it came from. Only on develop and main —
  # a pull request has nothing worth keeping.
  package:
    name: package
    needs: [backend, frontend, e2e]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml

      # Tests already ran in the backend job. Running them again would not make
      # the jar any more trustworthy, only slower.
      - name: Package once
        run: |
          ./mvnw -B -ntp -DskipTests package
          sha256sum target/*.jar > target/SHA256SUMS
          echo "commit=${GITHUB_SHA}" >> target/SHA256SUMS

      - name: Upload jar and checksum
        uses: actions/upload-artifact@v4
        with:
          name: crm-api-jar
          path: |
            backend/target/*.jar
            backend/target/SHA256SUMS

  # Pushes the image to GHCR -- the course's named registry -- so the Deployment
  # can pin a digest instead of a mutable tag (ADR-005's open follow-up).
  #
  # Only on push to develop/main, like package: a pull request's image is a
  # candidate, and candidates do not get published. Two tags per build: the
  # commit SHA (immutable, what the digest pin traces back to) and the branch
  # name (a convenience pointer, never deployed by name).
  publish:
    name: publish
    needs: [backend, frontend, image, e2e]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # The workflow default is contents: read. Publishing needs exactly one more
    # scope, granted here and nowhere else.
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@v3.5.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # provenance: false so the push is a single manifest, not an attestation
      # list -- the digest printed below is then the digest the cluster pulls,
      # with no unknown/unknown entries beside it.
      - name: Build and push
        id: push
        uses: docker/build-push-action@v7.3.0
        with:
          context: backend
          push: true
          provenance: false
          tags: |
            ghcr.io/pupilliluke/crm-api:${{ github.sha }}
            ghcr.io/pupilliluke/crm-api:${{ github.ref_name }}
          build-args: |
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The digest is the whole point of the job. Surfacing it here means
      # pinning the manifest is copy-paste from the run summary, not a docker
      # command against a machine that happens to have the image.
      - name: Record the digest
        run: |
          {
            echo "## Published image"
            echo
            echo '```'
            echo "ghcr.io/pupilliluke/crm-api@${{ steps.push.outputs.digest }}"
            echo "commit ${{ github.sha }}"
            echo '```'
            echo
            echo "Pin it: set this ref as \`image:\` in k8s/deployment.yaml."
          } >> "$GITHUB_STEP_SUMMARY"
